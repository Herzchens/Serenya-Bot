# Reviewed 2026-08-11. See SECURITY_AUDIT.md for dependency paths and reachability.
# New advisories are not ignored and remain fail-closed.
[advisories]
ignore = [
    # Locked through hpke-rs, but these optional libcrux backend crates are not selected
    # by Serenya's active workspace feature graph.
    "RUSTSEC-2026-0209",
    "RUSTSEC-2026-0211",
    "RUSTSEC-2026-0124",
    # Same locked-only libcrux-aesgcm crate; this advisory is informational
    # (crate renamed), not a runtime vulnerability in the selected build.
    "RUSTSEC-2026-0210",

    # libcrux-secrets is active transitively, but this advisory is AArch64-specific.
    # Serenya's current CI and auto-installed dependency artifacts are x86_64 only.
    "RUSTSEC-2026-0212",

    # hpke-rs 0.6.1 selects libcrux-sha3 unconditionally. Discord DAVE v1 uses
    # OpenMlsRustCrypto with P-256 / AES-128-GCM / SHA-256, not the affected SHAKE APIs.
    "RUSTSEC-2026-0207",
    "RUSTSEC-2026-0208",

    # Serenity 0.12.5 pins tokio-tungstenite 0.21 / rustls 0.22 / webpki 0.102.
    # Serenya does not configure CRLs; the remaining name-constraint advisories require
    # CA misissuance. Re-review when Serenity/Poise moves to the patched webpki line.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # Informational unmaintained-crate warnings with no patch-level remediation.
    # Latest stable Songbird/Poise still use derivative; Davey/OpenMLS still pulls
    # instant; HAX keeps proc-macro-error2 behind cfg(hax). See SECURITY_AUDIT.md
    # for migration gates.
    "RUSTSEC-2024-0388",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2026-0173",
]

# Treat informational security findings as CI failures unless they are explicitly
# reviewed and listed above. This includes unsound, unmaintained, and yanked warnings.
[output]
deny = ["warnings"]
quiet = false
