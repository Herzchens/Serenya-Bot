name: CI

on:
  push:
    branches: [ "main", "rust-1.96-upgrade", "reqwest-0.13", "workspace-ytdl-resolver" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev cmake build-essential pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Remove local target-cpu override
        run: rm -f .cargo/config.toml

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --workspace --locked

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --locked

      - name: DHAT redactor retention
        run: >-
          cargo test -p serenya --bin serenya --locked --features dhat-heap
          logging::redact::tests::rotating_history_retained_heap_stays_bounded_after_ten_thousand_unique_rotations
          -- --exact --test-threads=1

      - name: Cargo build release
        run: cargo build --workspace --release --locked

      - name: Cargo test release
        run: cargo test --workspace --release --locked

      - name: Install pinned cargo-audit
        shell: bash
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1 || [[ "$(cargo audit --version 2>/dev/null)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Cargo audit
        run: cargo audit

      - name: Inspect dependency tree duplicates
        run: cargo tree -d --locked
